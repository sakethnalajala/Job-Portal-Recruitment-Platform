# Render Blueprint for the TalentBridge API.
# Dashboard → Blueprints → New Blueprint Instance → pick this repo. Secret values (sync: false)
# are entered in the Render dashboard, never committed here.
services:
  - type: web
    name: talentbridge-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/src/server.js
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: EMAIL_PROVIDER
        value: console           # no real emails; they are printed to the Render log
      - key: EMAIL_FROM
        value: "TalentBridge <onboarding@resend.dev>"
      - key: API_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: info
      - key: CLIENT_URL
        sync: false              # your Vercel URL, e.g. https://talentbridge.vercel.app (CORS + email links)
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Demo Admin
